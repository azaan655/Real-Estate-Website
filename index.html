const RentalCard = ({
  rental,
  index,
  isGlobalPaused,
  onOpenDetail,
  hasDraggedRef
}) => {
  const views = useMemo(() => rentalViews(rental), [rental]);
  const [activeSlide, setActiveSlide] = useState(0);
  const [prevSlideLabel, setPrevSlideLabel] = useState(views[0]?.label || '');
  const [currSlideLabel, setCurrSlideLabel] = useState(views[0]?.label || '');
  const [isSaved, setIsSaved] = useState(false);
  const [isHovered, setIsHovered] = useState(false);
  const [isFocused, setIsFocused] = useState(false);
  const [isInView, setIsInView] = useState(index < 3); // Eager load first 3
  const [animatedPrice, setAnimatedPrice] = useState(0);
  const cardRef = useRef(null);
  const trackRef = useRef(null);
  const labelRef = useRef(null);
  const touchStartX = useRef(null);
  const touchStartY = useRef(null);
  const intervalRef = useRef(null);
  const kenBurnsTween = useRef(null);
  const SLIDE_MS = 2000;
  const TRAVEL = 0.8;
  const fullName = rental.name.replace(/\n/g, ' ');
  const idNum = rental.id.replace('R', '');
  const idLabel = `ID: 10${idNum}`;

  // IntersectionObserver for lazy loading and pausing when off-screen
  useEffect(() => {
    const cardEl = cardRef.current;
    if (!cardEl) return;
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          setIsInView(true);
        }
      });
    }, {
      rootMargin: '100px'
    });
    observer.observe(cardEl);
    return () => observer.disconnect();
  }, []);

  // Card entrance animation with ScrollTrigger
  useEffect(() => {
    const cardEl = cardRef.current;
    if (!cardEl) return;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion) {
      setAnimatedPrice(rental.rent);
      return;
    }
    const ctx = gsap.context(() => {
      const badges = cardEl.querySelectorAll('.card-badge-anim');
      const titleEl = cardEl.querySelector('.card-title-anim');
      const tl = gsap.timeline({
        scrollTrigger: {
          trigger: cardEl,
          start: 'top 88%',
          once: true
        }
      });
      tl.fromTo(cardEl, {
        y: 28,
        opacity: 0,
        filter: 'blur(8px)'
      }, {
        y: 0,
        opacity: 1,
        filter: 'blur(0px)',
        duration: 0.9,
        ease: 'power3.out'
      });
      if (badges.length > 0) {
        tl.fromTo(badges, {
          scale: 0.9,
          opacity: 0
        }, {
          scale: 1,
          opacity: 1,
          duration: 0.5,
          stagger: 0.06,
          ease: 'back.out(2)'
        }, '-=0.6');
      }
      if (titleEl) {
        tl.fromTo(titleEl, {
          yPercent: 100,
          opacity: 0
        }, {
          yPercent: 0,
          opacity: 1,
          duration: 0.6,
          ease: 'power3.out'
        }, '-=0.4');
      }

      // Count up price
      const priceObj = {
        val: 0
      };
      tl.to(priceObj, {
        val: rental.rent,
        duration: 1.4,
        ease: 'power2.out',
        onUpdate: () => setAnimatedPrice(Math.round(priceObj.val))
      }, '-=0.5');
    }, cardEl);
    return () => ctx.revert();
  }, [rental.rent]);

  // View Label Roll Animation
  const animateLabelRoll = useCallback(newLabel => {
    setPrevSlideLabel(currSlideLabel);
    setCurrSlideLabel(newLabel);
    if (labelRef.current) {
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!prefersReducedMotion) {
        gsap.fromTo(labelRef.current, {
          yPercent: 100,
          opacity: 0
        }, {
          yPercent: 0,
          opacity: 1,
          duration: 0.5,
          ease: 'power3.out'
        });
      }
    }
  }, [currSlideLabel]);

  // Slideshow transition logic
  const goToSlide = useCallback(targetSlide => {
    if (!trackRef.current) return;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const nextIdx = targetSlide % 4;
    const currentImg = trackRef.current.querySelector(`.slide-img-${nextIdx}`);
    if (currentImg && !prefersReducedMotion) {
      if (kenBurnsTween.current) kenBurnsTween.current.kill();
      gsap.set(currentImg, {
        scale: 1
      });
      kenBurnsTween.current = gsap.to(currentImg, {
        scale: 1.07,
        duration: 2.8,
        ease: 'none'
      });
    }
    animateLabelRoll(views[nextIdx]?.label || '');
    if (prefersReducedMotion) {
      setActiveSlide(nextIdx);
      gsap.set(trackRef.current, {
        xPercent: -100 * nextIdx
      });
      return;
    }

    // Normal slide animation
    if (targetSlide === 4) {
      // Transition to clone (index 4) then instantly reset to 0
      gsap.to(trackRef.current, {
        xPercent: -400,
        duration: TRAVEL,
        ease: 'power3.inOut',
        onComplete: () => {
          if (trackRef.current) {
            gsap.set(trackRef.current, {
              xPercent: 0
            });
          }
          setActiveSlide(0);
        }
      });
    } else {
      gsap.to(trackRef.current, {
        xPercent: -100 * targetSlide,
        duration: TRAVEL,
        ease: 'power3.inOut',
        onComplete: () => {
          setActiveSlide(targetSlide);
        }
      });
    }
  }, [TRAVEL, animateLabelRoll, views]);

  // Pre-decode next slide image 1 second before change
  const predecodeNext = useCallback(current => {
    const next = (current + 1) % 4;
    const view = views[next];
    if (view && typeof window !== 'undefined') {
      const img = new Image();
      img.src = view.src;
      if (img.decode) {

    }
  }, [views]);

  // Autoplay timer with staggered phase
  useEffect(() => {
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isPaused = isGlobalPaused || isHovered || isFocused || !isInView || prefersReducedMotion;
    if (isPaused) {
      if (intervalRef.current) clearInterval(intervalRef.current);
      return;
    }

    // Stagger initial phase: (index * 370) % 2000 ms
    const initialDelay = index * 370 % SLIDE_MS;
    const timeout = setTimeout(() => {
      intervalRef.current = setInterval(() => {
        setActiveSlide(prev => {
          const next = prev + 1;
          goToSlide(next);
          predecodeNext(next % 4);
          return next % 4;
        });
      }, SLIDE_MS);
    }, initialDelay);
    return () => {

      if (intervalRef.current) clearInterval(intervalRef.current);
    };
  }, [goToSlide, index, isFocused, isGlobalPaused, isHovered, isInView, predecodeNext]);

  // Touch & Pointer Swipe on Photo
  const handleTouchStart = e => {
    const clientX = 'touches' in e ? e.touches[0].clientX : e.clientX;
    const clientY = 'touches' in e ? e.touches[0].clientY : e.clientY;
    touchStartX.current = clientX;
    touchStartY.current = clientY;
  };
  const handleTouchEnd = e => {
    if (touchStartX.current === null) return;
    const clientX = 'changedTouches' in e ? e.changedTouches[0].clientX : e.clientX;
    const diffX = touchStartX.current - clientX;

    if (Math.abs(diffX) >= 40) {

        goToSlide((activeSlide + 1) % 4);

  };
  const handlePhotoKeyDown = e => {

  // WhatsApp link message

  const emailSubject = encodeURIComponent(`Enquiry: ${fullName} (${idLabel})`);
  return <article ref={cardRef} aria-label={fullName} onMouseEnter={() => setIsHovered(true)} onMouseLeave={() => setIsHovered(false)} onFocus={() => setIsFocused(true)} onBlur={() => setIsFocused(false)} className="rental-card group/card w-full h-full relative rounded-[24px] bg-white border border-[rgba(12,12,12,0.14)] p-[14px_14px_22px] shadow-[0_10px_30px_rgba(12,12,12,0.05)] hover:-translate-y-2 hover:shadow-[0_30px_60px_rgba(12,12,12,0.14)] transition-all duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] flex flex-col justify-between">

const RecentRentals = () => {
  const [isGlobalPaused, setIsGlobalPaused] = useState(false);
  const [activeDot, setActiveDot] = useState(0);
  const [canScrollLeft, setCanScrollLeft] = useState(false);
  const [canScrollRight, setCanScrollRight] = useState(true);
  const [selectedRental, setSelectedRental] = useState(null);
  const [selectedViewIdx, setSelectedViewIdx] = useState(0);
  const [isDetailOpen, setIsDetailOpen] = useState(false);
  const sectionRef = useRef(null);
  const scrollerRef = useRef(null);
  const isMouseDown = useRef(false);
  const startX = useRef(0);
  const scrollLeftStart = useRef(0);
  const hasDragged = useRef(false);
  const rAFId = useRef(null);
  const totalItems = rentals.length;

  // Compute cardsPerView based on viewport
  const getCardsPerView = useCallback(() => {
    if (typeof window === 'undefined') return 3;
    if (window.innerWidth >= 1024) return 3;
    if (window.innerWidth >= 768) return 2;
    return 1;
  }, []);
  const totalStops = useMemo(() => {
    // 10 stops on desktop (12 - 3 + 1)
    return Math.max(1, totalItems - getCardsPerView() + 1);
  }, [getCardsPerView, totalItems]);

  // Section Entrance Animation
  useEffect(() => {
    const sectionEl = sectionRef.current;
    if (!sectionEl) return;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion) return;
    const ctx = gsap.context(() => {
      const tl = gsap.timeline({
        scrollTrigger: {
          trigger: sectionEl,
          start: 'top 85%',
          once: true
        }
      });

      // Heading words rise through masks
      const words = sectionEl.querySelectorAll('.recent-heading-word');
      tl.fromTo(words, {
        yPercent: 110,
        filter: 'blur(6px)'
      }, {
        yPercent: 0,
        filter: 'blur(0px)',
        duration: 0.9,
        stagger: 0.05,
        ease: 'power3.out'
      });

      // Gold sheen sweep on accent text
      const sheenEl = sectionEl.querySelector('.recent-accent-sheen');
      if (sheenEl) {
        tl.fromTo(sheenEl, {
          backgroundPosition: '200% 0'
        }, {
          backgroundPosition: '-200% 0',
          duration: 1.2,
          ease: 'power2.inOut'
        }, '-=0.4');
      }

      // Description fades up
      const descEl = sectionEl.querySelector('.recent-desc');
      if (descEl) {
        tl.fromTo(descEl, {
          y: 16,
          opacity: 0,
          filter: 'blur(6px)'
        }, {
          y: 0,
          opacity: 0.65,
          filter: 'blur(0px)',
          duration: 1.0,
          ease: 'power3.out'
        }, '-=0.7');
      }
    }, sectionEl);
    return () => ctx.revert();
  }, []);

  // Sync scrollLeft with activeDot and edge fades
  const handleScroll = useCallback(() => {
    if (rAFId.current) cancelAnimationFrame(rAFId.current);
    rAFId.current = requestAnimationFrame(() => {
      const scroller = scrollerRef.current;
      if (!scroller) return;
      const firstCard = scroller.firstElementChild;
      if (!firstCard) return;
      const cardWidth = firstCard.offsetWidth;
      const gap = 24;
      const step = cardWidth + gap;
      const newIdx = Math.round(scroller.scrollLeft / step);
      setActiveDot(Math.min(Math.max(0, newIdx), totalStops - 1));
      setCanScrollLeft(scroller.scrollLeft > 5);
      const maxScroll = scroller.scrollWidth - scroller.clientWidth;
      setCanScrollRight(scroller.scrollLeft < maxScroll - 5);
    });
  }, [totalStops]);

  // Scroll to stop index
  const scrollToStop = useCallback(stopIdx => {
    const scroller = scrollerRef.current;
    if (!scroller) return;
    const firstCard = scroller.firstElementChild;
    if (!firstCard) return;
    const step = firstCard.offsetWidth + 24;
    scroller.scrollTo({
      left: stopIdx * step,
      behavior: 'smooth'
    });
  }, []);

  // Arrow button step
  const scrollStep = direction => {
    const target = activeDot + direction;
    if (target >= 0 && target < totalStops) {
      scrollToStop(target);
    }
  };

  // Mouse Drag on Desktop Scroller
  const handleMouseDown = e => {
    const scroller = scrollerRef.current;
    if (!scroller) return;
    isMouseDown.current = true;
    startX.current = e.pageX - scroller.offsetLeft;
    scrollLeftStart.current = scroller.scrollLeft;
    hasDragged.current = false;
    scroller.style.scrollSnapType = 'none';
  };
  const handleMouseMove = e => {
    if (!isMouseDown.current) return;
    const scroller = scrollerRef.current;
    if (!scroller) return;
    e.preventDefault();
    const x = e.pageX - scroller.offsetLeft;
    const walk = x - startX.current;
    if (Math.abs(walk) > 6) {
      hasDragged.current = true;
    }
    scroller.scrollLeft = scrollLeftStart.current - walk;
  };
  const handleMouseUpOrLeave = () => {
    if (!isMouseDown.current) return;
    isMouseDown.current = false;
    const scroller = scrollerRef.current;
    if (!scroller) return;
    scroller.style.scrollSnapType = 'x mandatory';
    const firstCard = scroller.firstElementChild;
    if (firstCard) {
      const step = firstCard.offsetWidth + 24;
      const nearestStop = Math.round(scroller.scrollLeft / step);
      scroller.scrollTo({
        left: nearestStop * step,
        behavior: 'smooth'
      });
    }

    // Reset hasDragged after a small delay to prevent click firing
    setTimeout(() => {
      hasDragged.current = false;
    }, 50);
  };

  // Keyboard navigation on Scroller
  const handleKeyDown = e => {
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      scrollStep(1);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      scrollStep(-1);
    }
  };
  const handleOpenDetail = (rental, viewIndex) => {
    setSelectedRental(rental);
    setSelectedViewIdx(viewIndex);
    setIsDetailOpen(true);
  };
  return <>
      <section id="recent-rentals" ref={sectionRef} aria-labelledby="recent-rentals-title" className="relative z-30 w-full bg-[#FAF8F4] text-[#0C0C0C] rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] px-4 sm:px-8 md:px-12 lg:px-16 pt-20 sm:pt-24 md:pt-32 pb-28 sm:pb-36 md:pb-44" style={{
      marginTop: 'calc(var(--home-overlap, 60px) * -1)'
    }}>
        <div className="max-w-[1180px] mx-auto">
          {/* ========================================================================= */}
          {/* 1. HEADER                                                                 */}
          {/* ========================================================================= */}
          <div className="lg:grid lg:grid-cols-[1fr_auto] lg:items-end gap-10 mb-14">
            <div>
              {/* Eyebrow */}
              <div className="flex items-center gap-3 mb-4">
                <span className="w-8 h-[2px] bg-[#A8832F] rounded-full" />
                <span className="font-sans font-medium text-[12px] uppercase tracking-[0.22em] text-[#A8832F]">
                  Fresh on the market
                </span>
              </div>

              {/* Title with word rise mask */}
              <h2 id="recent-rentals-title" className="font-serif text-[clamp(2.5rem,6vw,5.5rem)] leading-[0.98] tracking-[-0.02em] text-left text-[#0C0C0C]">
                <span className="block overflow-hidden pb-[0.12em]">
                  <span className="inline-block recent-heading-word">Recent</span>{' '}
                  <span className="inline-block recent-heading-word">rentals,</span>
                </span>
                <span className="block overflow-hidden pb-[0.12em]">
                  <span className="inline-block italic text-[#A8832F] recent-heading-word recent-accent-sheen">
                    ready to move in.
                  </span>
                </span>

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion) {
      setProgress(1);
      setPulsedSteps({
        1: true,
        2: true,
        3: true
      });
      return;
    }
    const ctx = gsap.context(() => {
      const tl = gsap.timeline({
        scrollTrigger: {
          trigger: sectionEl,
          start: 'top 75%',
          once: true
        }
      });

      // 1. Eyebrow dash draws
      tl.fromTo('.how-eyebrow-dash', {
        scaleX: 0,
        transformOrigin: 'center'
      }, {
        scaleX: 1,
        duration: 0.6,
        ease: 'power2.out'
      });

      // 2. Heading words rise through masks
      const words = sectionEl.querySelectorAll('.how-heading-word');
      tl.fromTo(words, {
        yPercent: 110,
        filter: 'blur(6px)'
      }, {
        yPercent: 0,
        filter: 'blur(0px)',
        duration: 0.9,
        stagger: 0.05,
        ease: 'power3.out'
      }, '-=0.3');

      // Gold sheen sweep on accent
      const sheen = sectionEl.querySelector('.how-accent-sheen');
      if (sheen) {
        tl.fromTo(sheen, {
          backgroundPosition: '200% 0'
        }, {
          backgroundPosition: '-200% 0',
          duration: 1.2,
          ease: 'power2.inOut'
        }, '-=0.5');
      }

      // 3. Tabs segmented pill rises
      tl.fromTo('.how-tabs-container', {
        y: 20,
        opacity: 0
      }, {
        y: 0,
        opacity: 1,
        duration: 0.6,
        ease: 'power3.out'
      }, '-=0.6');

      // 4. Step columns rise in stagger
      const stepCols = sectionEl.querySelectorAll('.how-step-column');
      tl.fromTo(stepCols, {
        y: 40,
        opacity: 0,
        filter: 'blur(8px)'
      }, {
        y: 0,
        opacity: 1,
        filter: 'blur(0px)',
        duration: 0.9,
        stagger: 0.15,
        ease: 'power3.out'
      }, '-=0.4');

      // Diamond borders draw
      const rects = sectionEl.querySelectorAll('.diamond-rect');
      rects.forEach(rect => {
        tl.fromTo(rect, {
          strokeDasharray: 260,
          strokeDashoffset: 260
        }, {
          strokeDashoffset: 0,
          duration: 1.1,
          ease: 'power3.inOut'
        }, '-=0.8');
      });
    }, sectionEl);
    return () => ctx.revert();
  }, []);

  // Intro word scrubbed opacity ramp
  useEffect(() => {
    const sectionEl = sectionRef.current;
    if (!sectionEl) return;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion) return;
    const ctx = gsap.context(() => {
      const introWords = sectionEl.querySelectorAll('.how-intro-word');
      if (introWords.length > 0) {
        gsap.fromTo(introWords, {
          opacity: 0.25
        }, {
          opacity: 1,
          stagger: 0.02,
          ease: 'none',
          scrollTrigger: {
            trigger: '.how-intro-paragraph',
            start: 'top 85%',
            end: 'top 45%',
            scrub: true
          }
        });
      }
    }, sectionEl);
    return () => ctx.revert();
  }, []);

  // Scroll Progress Driver for Connectors and Diamond Activations
  useEffect(() => {
    const stepsEl = stepsContainerRef.current;
    if (!stepsEl) return;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion) return;
    const ctx = gsap.context(() => {
      ScrollTrigger.create({
        trigger: stepsEl,
        start: 'top 70%',
        end: 'bottom 60%',
        scrub: 0.6,
        onUpdate: self => {
          const p = self.progress;
          setProgress(p);

          // Step 2 activation at p >= 0.45
          if (p >= 0.45 && !pulsedSteps[2]) {
            setPulsedSteps(prev => ({
              ...prev,
              2: true
            }));
            const diamond2 = stepsEl.querySelector('.diamond-wrap-2');
            if (diamond2) {
              gsap.fromTo(diamond2, {
                scale: 0.92
              }, {
                scale: 1,
                duration: 0.6,
                ease: 'back.out(2)'
              });
            }
          } else if (p < 0.42 && pulsedSteps[2]) {
            setPulsedSteps(prev => ({
              ...prev,
              2: false
            }));
          }

          // Step 3 activation at p >= 0.88
          if (p >= 0.88 && !pulsedSteps[3]) {
            setPulsedSteps(prev => ({
              ...prev,
              3: true
            }));
            const diamond3 = stepsEl.querySelector('.diamond-wrap-3');
            if (diamond3) {
              gsap.fromTo(diamond3, {
                scale: 0.92
              }, {
                scale: 1,
                duration: 0.6,
                ease: 'back.out(2)'
              });
            }
          } else if (p < 0.85 && pulsedSteps[3]) {
            setPulsedSteps(prev => ({
              ...prev,
              3: false
            }));
          }
        }
      });
    }, stepsEl);
    return () => ctx.revert();
  }, [pulsedSteps]);

  // Handle Tab Switch
  const handleTabChange = tabId => {
    if (tabId === activeTabId || isAnimatingTab) return;
    setIsAnimatingTab(true);

    // Announce to screen readers
    if (announcerRef.current) {
      const labelMap = {
        buy: 'buying',
        rent: 'renting',
        sell: 'selling'
      };
      announcerRef.current.textContent = `Showing the ${labelMap[tabId]} process`;
    }

    // Update URL query parameter
    if (typeof window !== 'undefined' && window.history && window.history.replaceState) {
      const url = new URL(window.location.href);
      url.searchParams.set('how', tabId);
      window.history.replaceState({}, '', url.toString());
    }
    const contentEl = contentWrapperRef.current;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion || !contentEl) {
      setActiveTabId(tabId);
      setIsAnimatingTab(false);
      return;
    }

    // 0.7s total timeline transition
    const tl = gsap.timeline({
      onComplete: () => {
        setIsAnimatingTab(false);
      }
    });

    // Outgoing content fades and rises -14px
    tl.to('.how-step-content', {
      y: -14,
      opacity: 0,
      filter: 'blur(4px)',
      duration: 0.25,
      ease: 'power2.in'
    });

    // RotateY illusion on icon
    tl.to('.diamond-icon-wrap', {
      rotateY: 90,
      duration: 0.25,
      ease: 'power2.in',
      onComplete: () => {
        setActiveTabId(tabId);
      }
    }, '-=0.15');

    // Incoming content rises in
    tl.fromTo('.how-step-content', {
      y: 18,
      opacity: 0,
      filter: 'blur(6px)'
    }, {
      y: 0,
      opacity: 1,
      filter: 'blur(0px)',
      duration: 0.45,
      stagger: 0.06,
      ease: 'power3.out'
    });
    tl.fromTo('.diamond-icon-wrap', {
      rotateY: 90,
      scale: 0.85
    }, {
      rotateY: 0,
      scale: 1,
      duration: 0.45,
      ease: 'power2.out'
    }, '-=0.4');
  };

  // Keyboard navigation on tabs
  const handleTabKeyDown = (e, index) => {
    const tabs = ['buy', 'rent', 'sell'];
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      const nextIdx = (index + 1) % tabs.length;
      handleTabChange(tabs[nextIdx]);
      tabButtonRefs.current[tabs[nextIdx]]?.focus();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      const prevIdx = (index - 1 + tabs.length) % tabs.length;
      handleTabChange(tabs[prevIdx]);
      tabButtonRefs.current[tabs[prevIdx]]?.focus();
    } else if (e.key === 'Home') {
      e.preventDefault();
      handleTabChange(tabs[0]);
      tabButtonRefs.current[tabs[0]]?.focus();
    } else if (e.key === 'End') {
      e.preventDefault();
      handleTabChange(tabs[tabs.length - 1]);
      tabButtonRefs.current[tabs[tabs.length - 1]]?.focus();

  };

  // Compute Connector Progress
  // Connector 1: progress 0.12 -> 0.42
  const conn1Progress = Math.min(Math.max((progress - 0.12) / 0.3, 0), 1);
  // Connector 2: progress 0.55 -> 0.85
  const conn2Progress = Math.min(Math.max((progress - 0.55) / 0.3, 0), 1);

              {HOW_TABS.map((tab, idx) => {

                    {tab.label}
                  </button>;

            </div>
          </div>
        </div>

        {/* ========================================================================= */}
        {/* 3. THE THREE STEPS                                                        */}
        {/* ========================================================================= */}
        <div ref={contentWrapperRef} role="tabpanel" id={`tabpanel-${activeTab.id}`} aria-labelledby={`tab-${activeTab.id}`} className="mt-20 md:mt-24">
          <ol ref={stepsContainerRef} className="flex flex-col lg:grid lg:grid-cols-[1fr_auto_1fr_auto_1fr] items-center lg:items-start gap-y-12 lg:gap-y-0 lg:gap-x-6">
            {activeTab.steps.map((step, idx) => {
            const stepNum = idx + 1;
            const tint = TINT_COLORS[step.tint];
            const isStepActive = stepNum === 1 ? true : stepNum === 2 ? progress >= 0.45 : progress >= 0.88;
            return <React.Fragment key={stepNum}>
                  {/* STEP COLUMN */}
                  <li aria-label={`Step ${stepNum} of 3`} className="how-step-column group/step flex flex-col items-center text-center w-full max-w-sm lg:max-w-none">

                      <svg width="104" height="104" viewBox="0 0 104 104" className="absolute inset-0 transition-transform duration-500 group-hover/step:-translate-y-1.5">

                      opacity: isStepActive ? 1 : 0.4

                      {/* Activation Ring Pulse */}

                      {/* Lucide Icon counter-rotated to remain upright */}

                    {/* Dynamic Step Content (animated on tab switch) */}

                      <div className="mt-6 inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-[rgba(244,239,230,0.14)] font-sans font-medium text-[11px] uppercase tracking-[0.14em] text-[rgba(244,239,230,0.62)] bg-[rgba(244,239,230,0.02)]">
                        <span className="w-1.5 h-1.5 rounded-full bg-[#D4AF6A]" />
                        <span>{step.duration}</span>
                      </div>

                      {/* 4. Title */}
                      <h3 className="font-serif text-[clamp(1.75rem,2.4vw,2.2rem)] leading-[1.1] text-[#F4EFE6] mt-5 group-hover/step:-translate-y-0.5 transition-transform duration-300">
                        {step.title}

                      {/* 5. Description */}
                      <p className="font-sans font-light text-[16px] leading-[1.75] text-[rgba(244,239,230,0.62)] max-w-sm mx-auto mt-4">

                      {/* 6. Check List */}
                      <ul className="mt-6 max-w-xs mx-auto text-left space-y-2.5 w-full">
                        {step.points.map((pt, pIdx) => <li key={pIdx} className="flex items-start gap-2.5">

                            <span className="font-sans text-[14px] text-[rgba(244,239,230,0.8)] leading-snug">
                              {pt}
                            </span>

                  </li>

                  {/* ARROW CONNECTOR BETWEEN STEPS */}
                  {idx < 2 && <>
                      {/* Desktop Horizontal Connector (hidden below lg) */}
                      <div aria-hidden="true" className="hidden lg:flex flex-col items-center justify-center min-w-[96px] h-full" style={{

                }}>

                          <div className="w-full h-[1px] bg-[rgba(244,239,230,0.14)]" />

                          <div className="absolute left-0 top-1/2 -translate-y-1/2 h-[2px] bg-[#D4AF6A] transition-transform duration-100 ease-out" style={{
                      width: '100%',

                      transform: `scaleX(${idx === 0 ? conn1Progress : conn2Progress})`
                    }} />

                          {/* Travelling gold dot once complete */}
                          {(idx === 0 ? conn1Progress : conn2Progress) >= 1 && <div className="absolute top-1/2 -translate-y-1/2 w-2 h-2 rounded-full bg-[#D4AF6A] shadow-[0_0_8px_#D4AF6A] how-travelling-dot-h" />}

                          {/* Arrowhead on right end */}
                          <svg width="8" height="12" viewBox="0 0 8 12" className="absolute -right-1 top-1/2 -translate-y-1/2 fill-none stroke-[rgba(244,239,230,0.4)]" style={{
                      stroke: (idx === 0 ? conn1Progress : conn2Progress) >= 0.95 ? '#D4AF6A' : 'rgba(244,239,230,0.4)'
                    }}>

                      <div aria-hidden="true" className="flex lg:hidden flex-col items-center justify-center w-full h-16 relative my-2">

                          {/* Base line */}
                          <div className="w-[1px] h-full bg-[rgba(244,239,230,0.14)]" />

                          {/* Gold scroll progress fill */}
                          <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[2px] bg-[#D4AF6A] transition-transform duration-100 ease-out" style={{
                      height: '100%',
                      transformOrigin: 'top',
                      transform: `scaleY(${idx === 0 ? conn1Progress : conn2Progress})`
                    }} />

                          {/* Travelling gold dot once complete */}
                          {(idx === 0 ? conn1Progress : conn2Progress) >= 1 && <div className="absolute left-1/2 -translate-x-1/2 w-2 h-2 rounded-full bg-[#D4AF6A] shadow-[0_0_8px_#D4AF6A] how-travelling-dot-v" />}

                          {/* Arrowhead at bottom */}
                          <svg width="12" height="8" viewBox="0 0 12 8" className="absolute -bottom-1 left-1/2 -translate-x-1/2 fill-none" style={{
                      stroke: (idx === 0 ? conn1Progress : conn2Progress) >= 0.95 ? '#D4AF6A' : 'rgba(244,239,230,0.4)'
                    }}>
                            <polyline points="1,1 6,7 11,1" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
                          </svg>
                        </div>
                      </div>
                    </>}
                </React.Fragment>;
          })}
          </ol>
        </div>

        {/* ========================================================================= */}
        {/* 4. TRUST STRIP                                                            */}
        {/* ========================================================================= */}
        <div className="mt-16 sm:mt-24 border-t border-b border-[rgba(244,239,230,0.14)] py-8">
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 lg:gap-8 divide-y sm:divide-y-0 lg:divide-x divide-[rgba(244,239,230,0.10)]">
            <div className="flex items-center justify-center gap-3 pt-4 lg:pt-0">
              <ShieldCheck size={20} className="text-[#D4AF6A] flex-shrink-0" />
              <span className="font-sans font-medium text-[12px] uppercase tracking-[0.16em] text-[rgba(244,239,230,0.85)]">
                Verified listings only
              </span>
            </div>

            <div className="flex items-center justify-center gap-3 pt-4 lg:pt-0">
              <Eye size={20} className="text-[#D4AF6A] flex-shrink-0" />

    const BackToTop = () => {
  const [isVisible, setIsVisible] = useState(false);
  const [scrollProgress, setScrollProgress] = useState(0);
  const [isLocked, setIsLocked] = useState(false);
  const buttonRef = useRef(null);
  const rAFRef = useRef(null);

  // Radius for 56px circular SVG ring (cx=28, cy=28, r=24)
  const RADIUS = 24;
  const CIRCUMFERENCE = 2 * Math.PI * RADIUS; // ~150.796

  // Scroll handler throttled via requestAnimationFrame
  const handleScroll = useCallback(() => {
    if (rAFRef.current) cancelAnimationFrame(rAFRef.current);
    rAFRef.current = requestAnimationFrame(() => {
      if (typeof window === 'undefined') return;
      const scrollY = window.scrollY || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = scrollHeight > 0 ? Math.min(Math.max(scrollY / scrollHeight, 0), 1) : 0;
      setScrollProgress(progress);
      setIsVisible(scrollY > 600);

      // Check if body scroll is locked by an overlay or drawer
      const bodyOverflow = document.body.style.overflow;
      setIsLocked(bodyOverflow === 'hidden');
    });
  }, []);
  useEffect(() => {
    window.addEventListener('scroll', handleScroll, {
      passive: true
    });
    handleScroll();

    // MutationObserver to detect body style changes (e.g. overflow: hidden)
    const observer = new MutationObserver(() => {
      const bodyOverflow = document.body.style.overflow;
      setIsLocked(bodyOverflow === 'hidden');
    });
    observer.observe(document.body, {
      attributes: true,
      attributeFilter: ['style', 'class']
    });
    return () => {
      window.removeEventListener('scroll', handleScroll);
      observer.disconnect();
      if (rAFRef.current) cancelAnimationFrame(rAFRef.current);
    };
  }, [handleScroll]);

  // Entrance / Exit animation
  useEffect(() => {
    const btn = buttonRef.current;
    if (!btn) return;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const shouldShow = isVisible && !isLocked;
    if (prefersReducedMotion) {
      gsap.set(btn, {
        opacity: shouldShow ? 1 : 0,
        pointerEvents: shouldShow ? 'auto' : 'none'
      });
      return;
    }
    if (shouldShow) {
      gsap.fromTo(btn, {
        scale: 0.8,
        opacity: 0,
        pointerEvents: 'none'
      }, {
        scale: 1,
        opacity: 1,
        pointerEvents: 'auto',
        duration: 0.4,
        ease: 'power3.out'
      });
    } else {
      gsap.to(btn, {
        scale: 0.8,
        opacity: 0,
        pointerEvents: 'none',
        duration: 0.3,
        ease: 'power3.in'
      });
    }
  }, [isVisible, isLocked]);
  const scrollToTop = () => {
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({
      top: 0,
      behavior: prefersReducedMotion ? 'auto' : 'smooth'
    });

    // Move focus to page h1 if present without scrolling
    const h1 = document.querySelector('h1');
    if (h1) {
      h1.tabIndex = -1;
      h1.focus({
        preventScroll: true
      });
    }
  };
  const strokeDashoffset = CIRCUMFERENCE * (1 - scrollProgress);
  return <button ref={buttonRef} type="button" onClick={scrollToTop} aria-label="Back to top" className="fixed right-5 bottom-5 md:right-7 md:bottom-7 w-14 h-14 rounded-full bg-[rgba(11,9,7,0.85)] backdrop-blur-md border border-[rgba(233,220,192,0.25)] shadow-[0_14px_40px_rgba(0,0,0,0.35)] z-[65] flex items-center justify-center text-[#F4EFE6] hover:text-[#D4AF6A] transition-colors group cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-[#D4AF6A] focus-visible:ring-offset-2 opacity-0 pointer-events-none">
      {/* Circular Progress Ring */}
      <svg width="56" height="56" viewBox="0 0 56 56" className="absolute inset-0 -rotate-90 pointer-events-none">
        {/* Background track circle */}
        <circle cx="28" cy="28" r={RADIUS} fill="none" stroke="rgba(244,239,230,0.12)" strokeWidth="2" />
        {/* Animated progress circle */}
        <circle cx="28" cy="28" r={RADIUS} fill="none" stroke="#D4AF6A" strokeWidth="2" strokeDasharray={CIRCUMFERENCE} strokeDashoffset={strokeDashoffset} strokeLinecap="round" className="transition-[stroke-dashoffset] duration-150 ease-out" />
      </svg>

      {/* Up Arrow Icon with lift on hover */}
      <ArrowUp size={20} className="relative z-10 transition-transform duration-300 group-hover:-translate-y-1 group-hover:text-[#D4AF6A]" />
    </button>;
};

                <p className="font-sans text-[12px] text-white/60 mt-6">

            {/* RIGHT COLUMN: Accordion (order-1 on mobile, order-2 on lg) */}

                  </div>
                  <p className="text-[15px] font-sans text-black/60">

                  </p>
                </div>}

              {/* No results view */}
              {filteredFaqs.length === 0 && <div className="text-center py-16 px-4 bg-white/50 rounded-3xl border border-black/10">
                  <h3 className="font-serif text-3xl sm:text-4xl text-[#0C0C0C] mb-3">

                  </h3>
                  <p className="font-sans text-[15px] text-[#8C671D] mb-6">
                    &quot;{debouncedQuery}&quot;

                  <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
                    <button type="button" onClick={() => {
                  setSearchQuery('');
                  setActiveCat('all');
                }} className="h-11 px-6 rounded-full bg-[#0C0C0C] text-white font-sans text-xs uppercase tracking-[0.14em] hover:bg-[#8C671D] transition-colors">
                      Clear search
                    </button>
                    <a href="#ask-form" className="font-sans text-sm text-[#0C0C0C]/70 hover:text-[#0C0C0C] underline underline-offset-4">

                  </div>

                        <div className="flex items-baseline justify-between">
                          <h2 id={`cat-heading-${group.category.id}`} className="font-serif text-[28px] text-[#0C0C0C]">
                            {group.category.label}
                          </h2>
                          <span className="font-serif italic text-[#8C671D] text-[18px]">
                            {String(gIdx + 1).padStart(2, '0')}

                        </div>
                        <p className="font-sans text-[14px] text-black/55 mt-1">

                      </div>

                                <div className="pl-4 sm:pl-[calc(3ch+2rem)] pr-4 pb-7 pt-1 max-w-2xl">

                                  <div className="mt-5 pt-4 border-t border-black/10 flex flex-wrap items-center justify-between gap-4 font-sans text-[12px] text-black/60">

                    <h3 className="font-serif text-[32px] text-[#0C0C0C] mb-1">
                      Cannot find your answer?
                    </h3>
                    <p className="font-sans text-[14px] text-black/60 mb-6">
                      Send your question and an advisor will reply personally.
                    </p>

                    <form onSubmit={handleAskSubmit} className="space-y-4">
                      <div>
                        <label htmlFor="ask-name" className="block font-sans text-xs uppercase tracking-[0.14em] text-black/60 mb-1.5 font-medium">
                          Full Name *
                        </label>
                        <input id="ask-name" type="text" value={askName} onChange={e => {
                      setAskName(e.target.value);
                      if (askErrors.name) setAskErrors(prev => ({
                        ...prev,
                        name: undefined
                      }));
                    }} placeholder="Your name" className="w-full h-12 px-4 rounded-lg border border-black/15 text-[15px] focus:outline-none focus:border-[#8C671D] focus:ring-2 focus:ring-[#D4AF6A]/25" />
                        {askErrors.name && <p className="text-xs text-red-500 mt-1" aria-live="polite">
                            {askErrors.name}
                          </p>}
                      </div>

                      <div>
                        <label htmlFor="ask-mobile" className="block font-sans text-xs uppercase tracking-[0.14em] text-black/60 mb-1.5 font-medium">
                          Mobile Number *
                        </label>
                        <input id="ask-mobile" type="tel" value={askMobile} onChange={e => {
                      setAskMobile(e.target.value);
                      if (askErrors.mobile) setAskErrors(prev => ({
                        ...prev,
                        mobile: undefined
                      }));
                    }} placeholder="10-digit mobile number" className="w-full h-12 px-4 rounded-lg border border-black/15 text-[15px] focus:outline-none focus:border-[#8C671D] focus:ring-2 focus:ring-[#D4AF6A]/25" />
                        {askErrors.mobile && <p className="text-xs text-red-500 mt-1" aria-live="polite">
                            {askErrors.mobile}
                          </p>}
                      </div>

                      <div>
                        <label htmlFor="ask-question" className="block font-sans text-xs uppercase tracking-[0.14em] text-black/60 mb-1.5 font-medium">
                          Your Question *
                        </label>
                        <textarea id="ask-question" rows={4} value={askQuestion} onChange={e => {
                      setAskQuestion(e.target.value);
                      if (askErrors.question) setAskErrors(prev => ({
                        ...prev,
                        question: undefined
                      }));
                    }} placeholder="What would you like to know?" className="w-full p-4 rounded-lg border border-black/15 text-[15px] focus:outline-none focus:border-[#8C671D] focus:ring-2 focus:ring-[#D4AF6A]/25 resize-y" />
                        {askErrors.question && <p className="text-xs text-red-500 mt-1" aria-live="polite">
                            {askErrors.question}
                          </p>}
                      </div>

                      <button type="submit" disabled={isAskSubmitting} className="h-12 px-8 rounded-full bg-[#0C0C0C] text-white font-sans font-medium text-xs uppercase tracking-[0.14em] hover:bg-[#8C671D] transition-colors cursor-pointer disabled:opacity-50">
                        {isAskSubmitting ? 'Sending...' : 'Send my question'}
                      </button>
                    </form>
                  </div>}
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* 40px black gap before footer */}
      <div className="h-10 w-full bg-[#0B0907]" />

      {/* 7. SITE FOOTER (only rendered on /faqs) */}
      <SiteFooter />
    </div>;
};
