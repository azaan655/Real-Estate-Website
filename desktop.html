<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VESTA &mdash; Desktop Viewport Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #070605;
      color: #F4EFE6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden">
  <!-- Top Switcher Bar -->
  <header class="w-full bg-[#0E0C09] border-b border-[rgba(244,239,230,0.12)] px-4 py-3 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <span class="font-serif text-lg font-medium tracking-[0.2em] text-[#F4EFE6] uppercase">VESTA</span>
      <span class="h-4 w-[1px] bg-[rgba(244,239,230,0.2)]"></span>
      <span class="text-xs px-2.5 py-1 rounded-full bg-[#D4AF6A]/15 text-[#D4AF6A] border border-[#D4AF6A]/30 font-medium tracking-wide">
        Desktop View (Full Screen &gt; 1024 px)
      </span>
    </div>

    <!-- Viewport Switcher Pills -->
    <div class="flex items-center gap-2 text-xs">
      <a href="/desktop.html" class="px-3.5 py-1.5 rounded-full bg-[#D4AF6A] text-[#0C0C0C] font-semibold flex items-center gap-1.5 shadow-sm">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
        <span>Desktop</span>
      </a>

      <a href="/tablet.html" class="px-3.5 py-1.5 rounded-full border border-[rgba(244,239,230,0.2)] text-[rgba(244,239,230,0.7)] hover:text-white hover:border-white transition-all flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="12" x2="12.01" y1="18" y2="18"/></svg>
        <span>Tablet (Tab)</span>
      </a>

      <a href="/phone.html" class="px-3.5 py-1.5 rounded-full border border-[rgba(244,239,230,0.2)] text-[rgba(244,239,230,0.7)] hover:text-white hover:border-white transition-all flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="20" x="5" y="2" rx="2"/><line x1="12" x2="12.01" y1="18" y2="18"/></svg>
        <span>Phone (Mobile)</span>
      </a>
    </div>

    <div class="hidden sm:flex items-center gap-2">
      <a href="/" class="text-xs text-[rgba(244,239,230,0.6)] hover:text-[#D4AF6A] transition-colors flex items-center gap-1">
        <span>Direct site link (no frame)</span>
        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
      </a>
    </div>
  </header>

  <!-- Full Desktop Viewport Area -->
  <main class="flex-1 w-full h-[calc(100vh-53px)] flex flex-col">
    <iframe src="/" class="w-full flex-1 border-0 bg-black" title="VESTA Desktop Viewport Preview"></iframe>
  </main>
</body>
</html>
